[package]
name = "textscribe"
version = "0.1.4"
edition = "2024"
description = "A small Markdown to HTML, EPUB, and PDF converter"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
pulldown-cmark = "0.13"
thiserror = "2"
zip = { version = "6", default-features = false }
tempfile = "3"
